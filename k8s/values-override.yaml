ui:
  endpoints:
    catalog: "http://retail-store-catalog:80"
    carts: "http://retail-store-carts:80"
    checkout: "http://retail-store-checkout:80"
    orders: "http://retail-store-orders:80"
    assets: "http://retail-store-assets:80"

catalog:
  serviceAccount:
    create: false
    name: bedrock-app-sa
  mysql:
    create: false
    endpoint: "bedrock-catalog-mysql.cux4qe20q18n.us-east-1.rds.amazonaws.com:3306"
    database: "catalog"
    secret:
      create: false
      name: catalog-db

orders:
  serviceAccount:
    create: false
    name: bedrock-app-sa
  postgresql:
    create: false
    endpoint:
      host: "bedrock-orders-postgres.cux4qe20q18n.us-east-1.rds.amazonaws.com"
      port: 5432
    database: "orders"
    secret:
      create: false
      name: orders-db

carts:
  serviceAccount:
    create: false
    name: bedrock-app-sa
  persistence: dynamodb
  dynamodb:
    create: false
    createTable: false
    tableName: "bedrock-carts"
