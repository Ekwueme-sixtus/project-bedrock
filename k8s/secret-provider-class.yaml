apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: catalog-db-secrets
  namespace: retail-app
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "bedrock/catalog-mysql-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"
  secretObjects:
    - secretName: catalog-db
      type: Opaque
      data:
        - objectName: "username"
          key: username
        - objectName: "password"
          key: password
---
